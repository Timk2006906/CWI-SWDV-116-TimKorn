<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tim's Car Rentals Cars">
    <title>Tim's Car Rentals Cars</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site-header">
        <header class="header">
            <h1><a href="index.html">Tim's Car Rentals</a></h1>
        </header>
        <nav class="navbar">
            <input type="checkbox" id="toggle">
            <label for="toggle" class="menu-btn"></label>
            <ul class="menu">
                <li class="fa fa-home"><a href="index.html"> Home</a></li>
                <li class="fa fa-car"><a href="cars.html"> Cars</a></li>
                <li class="fa fa-comment"><a href="testimonials.html"> Testimonials</a></li>
                <li class="fa fa-info-circle"><a href="about.html"> About</a></li>
                <li class="fa fa-envelope"><a href="contact.html"> Contact</a></li>
            </ul>
        </nav>
    </div>
    <div id="car-list"></div>  
    <dialog id="rental-dialog">
    <h2>Confirm Your Rental</h2>

    <p id="rental-car"></p>
    <p id="rental-start"></p>
    <p id="rental-return"></p>


    <button id="confirm-button">Confirm</button>
    <button id="cancel-button">Cancel</button>
</dialog>
<script src="main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", listCars);
  document.addEventListener("confirm-rental", function(event){
    console.log(event.detail.carType);
    console.log(event.detail.startDate);
    console.log(event.detail.returnDate);  
    const dialog = document.getElementById("rental-dialog");

document.getElementById("rental-car").textContent = "Car Type: " + event.detail.carType;
document.getElementById("rental-start").textContent = "Start Date: " + event.detail.startDate;
document.getElementById("rental-return").textContent = "Return Date: " + event.detail.returnDate;
    dialog.showModal(); 
  });
  document.getElementById("cancel-button").addEventListener("click", function() {
    const dialog = document.getElementById("rental-dialog");
    dialog.close();
});
document.getElementById("confirm-button").addEventListener("click", function() {
const dialog = document.getElementById("rental-dialog");
dialog.close();

console.log(document.getElementById("rental-car").textContent);
console.log(document.getElementById("rental-start").textContent);
console.log(document.getElementById("rental-return").textContent);
});
</script>
</body>
</html>
